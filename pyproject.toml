[project]
name = "office2llm"
version = "0.3.0"
description = "Convert native Word documents to Markdown and fall back to full-page OCR for image-bearing documents and other formats."
requires-python = ">=3.10"
dependencies = [
  "pypdfium2==5.5.0",
  "Pillow==12.1.1",
  "google-genai==1.65.0",
]

[project.scripts]
office2llm = "office2llm:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
