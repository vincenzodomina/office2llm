name: Dependencies and tests
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install --no-deps .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install uv==0.8.22
      - run: uvx pip-audit==2.10.1 -r requirements.txt --require-hashes
      - run: |
          uv pip compile pyproject.toml --universal --python-version 3.10 --generate-hashes -o requirements.txt
          git diff --exit-code -- requirements.txt
